<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarPlay Simulator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CarPlay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050608">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: Fahrzeugdisplay (16:9) oben, Verwaltung der Apps darunter. Display bleibt immer dunkel. */
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#14171c; --muted:#5d6572; --line:#d9dde3; --accent:#0a7cff;
  --danger:#d93025;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1014;--panel:#181b21;--ink:#eceff4;--muted:#98a1af;--line:#2a2f38;--accent:#4aa3ff;--danger:#ff6b60;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1014;--panel:#181b21;--ink:#eceff4;--muted:#98a1af;--line:#2a2f38;--accent:#4aa3ff;--danger:#ff6b60;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.4rem;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem}

/* ---------- Display ---------- */
html,body{height:100%;overflow:hidden;background:#000}
.stage{position:fixed;inset:0;background:#000;overflow:hidden}
.screen{--u:min(1cqw,calc(1cqh*1.7778));container-type:size;position:absolute;inset:0;overflow:hidden;color:#f2f4f8;
  background:radial-gradient(120% 140% at 70% 10%,#1b2a4a 0%,#0c1222 55%,#070a12 100%);display:flex;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.gear{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;z-index:30;display:grid;place-items:center;padding:0}
.gear.on,.gear.on:hover{background:var(--ink);color:var(--bg)}
.gear:hover{background:rgba(255,255,255,.28)}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top);-webkit-overflow-scrolling:touch}
.sheet .wrap{padding-top:64px}
.sheetfoot{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.sheetfoot .btn{width:100%;min-height:48px;font-size:1rem}
.sheet[hidden]{display:none}

.side{width:calc(13 * var(--u));flex:none;display:flex;flex-direction:column;align-items:center;padding:calc(2 * var(--u)) 0 calc(1.6 * var(--u));gap:calc(1.2 * var(--u));background:rgba(0,0,0,.35);border-right:1px solid rgba(255,255,255,.08)}
.clock{font-weight:800;font-size:calc(2.6 * var(--u));font-variant-numeric:tabular-nums;letter-spacing:.02em}
.status{display:flex;gap:calc(.6 * var(--u));align-items:flex-end;height:calc(1.6 * var(--u))}
.status i{display:block;width:calc(.5 * var(--u));background:#cfd6e4;border-radius:1px}
.status i:nth-child(1){height:35%}.status i:nth-child(2){height:55%}.status i:nth-child(3){height:78%}.status i:nth-child(4){height:100%;opacity:.35}
.dock{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(1.4 * var(--u))}
.home{width:calc(7 * var(--u));height:calc(7 * var(--u));border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer}
.home:hover{background:rgba(255,255,255,.2)}
.home svg{width:calc(3.6 * var(--u));height:calc(3.6 * var(--u))}
.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}

.ico{border:0;cursor:pointer;display:grid;place-items:center;color:#fff;position:relative;padding:0}
.ico svg{width:56%;height:56%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock .ico{width:calc(7.2 * var(--u));height:calc(7.2 * var(--u));border-radius:calc(1.8 * var(--u))}
.dock .ico:active,.tile:active .ico{transform:scale(.94)}

.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:calc(1 * var(--u)) calc(2 * var(--u));padding:calc(3.4 * var(--u)) calc(3 * var(--u)) 0}
.tile{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1 * var(--u));cursor:pointer;position:relative;min-width:0}
.tile .ico{width:calc(10.4 * var(--u));height:calc(10.4 * var(--u));border-radius:calc(2.6 * var(--u));box-shadow:0 calc(.5 * var(--u)) calc(1.4 * var(--u)) rgba(0,0,0,.4)}
.tile span.lbl{font-size:calc(1.9 * var(--u));font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.add .ico{background:rgba(255,255,255,.08);border:calc(.25 * var(--u)) dashed rgba(255,255,255,.4);box-shadow:none}
.edit .tile:not(.add) .ico{animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
@media (prefers-reduced-motion:reduce){.edit .tile .ico{animation:none}}
.del{position:absolute;top:calc(-.6 * var(--u));left:calc(50% - calc(7.2 * var(--u)));width:calc(3.4 * var(--u));height:calc(3.4 * var(--u));border-radius:50%;border:0;background:#e5e7eb;color:#111;font-weight:800;font-size:calc(2.4 * var(--u));line-height:1;display:grid;place-items:center;cursor:pointer;z-index:2;box-shadow:0 calc(.2 * var(--u)) calc(.6 * var(--u)) rgba(0,0,0,.5)}
.pager{height:calc(5.6 * var(--u));display:flex;align-items:center;justify-content:center;gap:calc(1.4 * var(--u))}
.pager button{width:calc(1.5 * var(--u));height:calc(1.5 * var(--u));border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.3);cursor:pointer}
.pager button[aria-current="true"]{background:#fff}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:calc(4 * var(--u));height:calc(8 * var(--u));border:0;background:rgba(255,255,255,.08);color:#fff;font-size:calc(3 * var(--u));cursor:pointer;border-radius:calc(1 * var(--u))}
.nav.l{left:calc(.6 * var(--u))}.nav.r{right:calc(.6 * var(--u))}
.editbar{position:absolute;top:calc(1 * var(--u));right:calc(2 * var(--u));font-size:calc(1.6 * var(--u));background:#fff;color:#111;border:0;border-radius:calc(2 * var(--u));padding:calc(.5 * var(--u)) calc(1.6 * var(--u));font-weight:800;cursor:pointer}

.tile.sel .ico{outline:calc(.4 * var(--u)) solid #fff;outline-offset:calc(.5 * var(--u));animation:none}
.hint{position:absolute;top:calc(1.2 * var(--u));left:calc(3 * var(--u));font-size:calc(1.5 * var(--u));color:#aeb7c6;max-width:60%}
.tile[draggable="true"]{cursor:grab}
.apps .mv{display:flex;flex-direction:column;gap:2px}
.apps .mv button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:30px;height:20px;line-height:1;cursor:pointer;padding:0;font-size:.7rem}
.apps .mv button:disabled{opacity:.35;cursor:default}
/* App-Ansicht */
.appview{position:absolute;inset:0;background:#0b0f1a;display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.apphead{display:flex;align-items:center;gap:calc(1.6 * var(--u));padding:calc(1.6 * var(--u)) calc(2.4 * var(--u));border-bottom:1px solid rgba(255,255,255,.08)}
.apphead .ico{width:calc(5 * var(--u));height:calc(5 * var(--u));border-radius:calc(1.3 * var(--u))}
.apphead h2{margin:0;font-size:calc(2.4 * var(--u));font-weight:800}
.body{flex:1;min-height:0;display:flex;gap:calc(2.4 * var(--u));padding:calc(2 * var(--u)) calc(2.4 * var(--u))}
.card{background:rgba(255,255,255,.07);border-radius:calc(1.6 * var(--u));padding:calc(1.6 * var(--u))}
.row{display:flex;align-items:center;gap:calc(1.4 * var(--u));padding:calc(1.1 * var(--u)) calc(1.4 * var(--u));border-radius:calc(1.2 * var(--u));background:rgba(255,255,255,.06);border:0;color:inherit;width:100%;text-align:left;cursor:pointer;font-size:calc(2 * var(--u))}
.row:hover{background:rgba(255,255,255,.12)}
.list{display:flex;flex-direction:column;gap:calc(1 * var(--u));overflow:auto}
.big{font-size:calc(3.4 * var(--u));font-weight:800;font-variant-numeric:tabular-nums}
.small{font-size:calc(1.7 * var(--u));color:#aeb7c6}
.pill{display:inline-grid;place-items:center;background:#1fbf6a;color:#04210f;border:0;border-radius:calc(2 * var(--u));padding:calc(.7 * var(--u)) calc(2 * var(--u));font-weight:800;font-size:calc(1.9 * var(--u));cursor:pointer}
.pill.red{background:#ff453a;color:#fff}
.map{flex:1;border-radius:calc(1.6 * var(--u));overflow:hidden;background:#16213a;min-width:0}
.map svg{width:100%;height:100%;display:block}
.route{stroke-dasharray:6 4;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.cover{width:calc(22 * var(--u));height:calc(22 * var(--u));border-radius:calc(2 * var(--u));display:grid;place-items:center;flex:none}
.cover svg{width:50%;height:50%;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bar{height:calc(.8 * var(--u));background:rgba(255,255,255,.18);border-radius:calc(1 * var(--u));overflow:hidden;margin:calc(1 * var(--u)) 0}
.bar b{display:block;height:100%;background:#fff;width:0}
.ctrls{display:flex;gap:calc(2 * var(--u));align-items:center}
.ctrls button{width:calc(6 * var(--u));height:calc(6 * var(--u));border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:calc(2.4 * var(--u));cursor:pointer}
.ctrls button.play{width:calc(8 * var(--u));height:calc(8 * var(--u));background:#fff;color:#111;font-size:calc(3 * var(--u))}
.overlay{position:absolute;inset:0;background:rgba(5,8,16,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1.6 * var(--u));z-index:5}
.overlay .av{width:calc(12 * var(--u));height:calc(12 * var(--u));border-radius:50%;background:#55627a;display:grid;place-items:center;font-size:calc(5 * var(--u));font-weight:800}

/* ---------- Verwaltung ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h2{margin:0 0 4px;font-size:1.1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.apps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.apps li{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.chip{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.chip svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.apps .n{flex:1;min-width:0}
.apps .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apps .n small{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.9rem;margin-top:12px}
input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:400}
fieldset{border:0;padding:0;margin:12px 0 0}
legend{font-weight:600;font-size:.9rem;padding:0;margin-bottom:6px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks input{position:absolute;opacity:0;pointer-events:none}
.picks label{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.picks label svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.picks input:checked+label{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.picks input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.picks.col label{border-radius:50%;border-color:transparent;width:32px;height:32px}
.picks.col input:checked+label{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--panel)}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:8px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- Responsive ---------- */
.screen{--u:min(1cqw,calc(1cqh*1.7778));display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main main" "dock home"}
.side{display:contents}
.main{grid-area:main;min-height:0;min-width:0}
.dock{grid-area:dock;flex:none;flex-direction:row;justify-content:flex-start;align-items:center;padding:calc(var(--u)*1.2) calc(var(--u)*3);gap:calc(var(--u)*1.8);min-width:0}
.dock .ico{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);border-radius:calc(var(--u)*1.7)}
.home{grid-area:home;margin:calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*1.2) 0;width:calc(var(--u)*6.4);height:calc(var(--u)*6.4)}
.home svg{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2)}
.grid{padding-top:56px}
.editbar{right:auto;left:calc(var(--u)*2);top:calc(var(--u)*1.2);font-size:calc(var(--u)*2.2)}
.tile .lbl{font-size:calc(var(--u)*2.2)}
.dial{align-items:stretch}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:calc(var(--u)*1.2);flex:1;min-width:0;max-width:calc(var(--u)*42)}
.key{border:0;border-radius:calc(var(--u)*2);background:rgba(255,255,255,.12);color:#fff;font-size:calc(var(--u)*3.4);font-weight:700;cursor:pointer;min-height:calc(var(--u)*5.5)}
.key:active{background:rgba(255,255,255,.28)}
.dialside{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.2);min-width:0}
.dialside .pill{align-self:flex-start;margin-top:0!important}
.dnum{font-size:calc(var(--u)*4);font-weight:800;font-variant-numeric:tabular-nums;min-height:1.3em;word-break:break-all}
.pill.off{opacity:.35;pointer-events:none}
@media (orientation:portrait){
  .screen{--u:min(2.4cqw,calc(1cqh*1.1))}
  .grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);padding:56px calc(var(--u)*2) 0;gap:calc(var(--u)*1)}
  .tile .lbl{font-size:calc(var(--u)*1.85)}
  .body{flex-direction:column}
  .body>.list{width:auto!important;flex:1 1 52%;min-height:0}
  .body>.map{order:-1;flex:1 1 40%;min-height:0}
  .body>div:not(.cover):not(.map):not(.list){align-self:stretch}
  .dial .dialside{order:-1;flex:none}
  .keys{max-width:none;min-height:0}
  .apphead h2{font-size:calc(var(--u)*2.8)}
  .row{font-size:calc(var(--u)*2.3)}
  .small{font-size:calc(var(--u)*2)}
}
</style>
</head>
<body>
<div class="stage"><div class="screen" id="screen" aria-label="Fahrzeugdisplay"></div></div>
<button class="gear" id="gear" type="button" aria-label="Apps verwalten" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
<div class="sheet" id="sheet" hidden>
<div class="wrap">
  <div class="cols">
    <section class="panel" aria-labelledby="h-list">
      <h2 id="h-list">Installierte Apps <span id="count" class="sub"></span></h2>
      <ul class="apps" id="applist"></ul>
      <div class="tools">
        <button class="btn" id="btn-edit" aria-pressed="false" type="button">Display bearbeiten</button>
        <button class="btn danger" id="btn-reset" type="button">Auf Standard zurücksetzen</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-add">
      <h2 id="h-add">App hinzufügen</h2>
      <form id="form" novalidate>
        <label class="f" for="f-preset">Vorlage
          <select id="f-preset"></select>
        </label>
        <label class="f" for="f-name">Name
          <input type="text" id="f-name" maxlength="14" placeholder="z. B. Radio" autocomplete="off">
        </label>
        <fieldset><legend>Symbol</legend><div class="picks" id="f-icons"></div></fieldset>
        <fieldset><legend>Farbe</legend><div class="picks col" id="f-colors"></div></fieldset>
        <label class="f" for="f-tpl">Verhalten beim Öffnen
          <select id="f-tpl">
            <option value="nav">Navigation (Karte mit Route)</option>
            <option value="music">Musik (Player)</option>
            <option value="phone">Telefon (Kontakte, Anruf)</option>
            <option value="msg">Nachrichten (Kontakte, SMS)</option>
            <option value="generic" selected>Allgemein (Platzhalter mit Notiz)</option>
          </select>
        </label>
        <label class="f" for="f-link">Link zur echten App
          <input type="text" id="f-link" placeholder="https://… oder tel:{q}  ({q} = Ziel bzw. Nummer)" autocomplete="off" inputmode="url">
        </label>
        <label class="f" for="f-note">Notiz (nur bei „Allgemein“)
          <input type="text" id="f-note" maxlength="80" placeholder="Text, der in der App erscheint" autocomplete="off">
        </label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn primary" type="submit">Hinzufügen</button>
      </form>
    </section>
  </div>
  <div class="sheetfoot"><button class="btn primary" id="close" type="button">Schliessen</button></div>
</div>
</div>

<script>
(function(){
  var KEY='carplay-sim-v1', PER_PAGE=8, MAX_APPS=40;
  var mq=window.matchMedia('(orientation:portrait)');
  function setPer(){PER_PAGE=mq.matches?12:8}
  setPer();
  var onMq=function(){setPer();renderScreen()};
  if(mq.addEventListener)mq.addEventListener('change',onMq);else if(mq.addListener)mq.addListener(onMq);
  var ICONS={
    nav:'<path d="M12 3l7 17-7-4-7 4z"/>',
    music:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.4"/><circle cx="17" cy="16" r="2.4"/>',
    phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    msg:'<path d="M4 5h16v11H9l-5 4z"/>',
    mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    cloud:'<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1-.5 7z"/>',
    fuel:'<path d="M5 20V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15M4 20h11M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
    park:'<path d="M9 20V5h5a4 4 0 0 1 0 8H9"/>',
    book:'<path d="M4 5a2 2 0 0 1 2-1h13v15H6a2 2 0 0 0-2 2zM4 19a2 2 0 0 0 2 1h13"/>',
    radio:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l10-4M8 14h5M16 14h1"/>',
    car:'<path d="M5 16V12l2-5h10l2 5v4M3 16h18v3H3zM7 12h10"/><circle cx="7.5" cy="16" r=".6"/><circle cx="16.5" cy="16" r=".6"/>',

    S.uid++;
    var app={id:'u'+S.uid,name:name,
      icon:document.querySelector('input[name=icon]:checked').value,
      color:document.querySelector('input[name=color]:checked').value,
      tpl:document.getElementById('f-tpl').value,
      note:document.getElementById('f-note').value.trim(),link:link};
    S.apps.push(app);
    S.page=Math.floor((S.apps.length-1)/PER_PAGE);
    S.open=null;save();renderScreen();renderList();
    document.getElementById('f-name').value='';document.getElementById('f-note').value='';document.getElementById('f-link').value='';document.getElementById('f-preset').value='';lastPre='';
    document.getElementById('f-name').focus();
  });

  var PRESETS=[
    {k:'apple-maps',label:'Apple Karten',tpl:'nav',icon:'nav',color:'#2f80ed',link:'https://maps.apple.com/?daddr={q}&dirflg=d'},
    {k:'gmaps',label:'Google Maps',tpl:'nav',icon:'nav',color:'#1fbf6a',link:'https://www.google.com/maps/dir/?api=1&destination={q}&travelmode=driving'},
    {k:'waze',label:'Waze',tpl:'nav',icon:'car',color:'#30b0c7',link:'https://waze.com/ul?q={q}&navigate=yes'},
    {k:'apple-music',label:'Apple Musik',tpl:'music',icon:'music',color:'#ff453a',link:'https://music.apple.com'},
    {k:'apple-podcasts',label:'Apple Podcasts',tpl:'music',icon:'mic',color:'#af52de',link:'https://podcasts.apple.com'},
    {k:'apple-phone',label:'Telefon',tpl:'phone',icon:'phone',color:'#1fbf6a',link:'tel:{q}'},
    {k:'apple-msg',label:'Nachrichten',tpl:'msg',icon:'msg',color:'#30b0c7',link:'sms:{q}'},
    {k:'playsrf',label:'Play SRF',tpl:'generic',icon:'radio',color:'#ff453a',link:'https://apps.apple.com/app/id638194352',note:'Radio und Video von SRF mit der Play-SRF-App.'}
  ];
  var $pre=document.getElementById('f-preset'), lastPre='';
  $pre.innerHTML='<option value="">Eigene App (ohne Vorlage)</option>'+PRESETS.map(function(p){return '<option value="'+p.k+'">'+esc(p.label)+'</option>'}).join('');
  $pre.addEventListener('change',function(){
    var p=PRESETS.filter(function(x){return x.k===$pre.value})[0]; if(!p)return;
    var nm=document.getElementById('f-name');
    if(!nm.value||nm.value===lastPre)nm.value=p.label;
    lastPre=p.label;
    document.getElementById('ic-'+p.icon).checked=true;
    var ci=COLORS.indexOf(p.color); if(ci>=0)document.getElementById('co-'+ci).checked=true;
    document.getElementById('f-tpl').value=p.tpl;
    document.getElementById('f-link').value=p.link;
    if(p.note)document.getElementById('f-note').value=p.note;
  });

  load();renderScreen();renderList();
})();
</script>
</body>
</html>
